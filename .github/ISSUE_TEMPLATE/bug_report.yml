name: Bug report
description: Report a problem with the ElevenLabs Android SDK
labels: [bug]
body:
  - type: input
    id: sdk-version
    attributes:
      label: SDK version
      placeholder: "0.11"
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android version / device
      placeholder: "Android 14, Pixel 8"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Conversation mode
      options:
        - Voice (LiveKit/WebRTC)
        - Text-only (WebSocket)
        - Both / not sure
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a session with ...
        2. Send ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Logcat output, stack traces, etc. Redact API keys and tokens.
      render: text
